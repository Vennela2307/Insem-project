
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleTech - Online Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>StyleTech</h1>
    <nav>
        <a href="#home">Home</a>
        <a href="#products">Products</a>
        <a href="#cart">Cart 🛒 (<span id="count">0</span>)</a>
    </nav>
</header>

<section class="hero" id="home">
    <h2>Fashion Meets Technology</h2>
    <p>Discover stylish outfits and the latest electronic devices.</p>
    <a href="#products" class="shop-btn">Shop Now</a>
</section>

<section class="container" id="products">
    <h2>Our Products</h2>

    <div class="filters">
        <input type="search" id="search"
               placeholder="Search products...">

        <select id="category">
            <option value="All">All Categories</option>
            <option value="Fashion">Fashion</option>
            <option value="Electronics">Electronics</option>
        </select>
    </div>

    <div id="product-list" class="products"></div>
    <p id="empty" hidden>No products found!</p>
</section>

<section class="container cart-section" id="cart">
    <h2>Shopping Cart 🛒</h2>
    <div id="cart-items">Your cart is empty.</div>
    <h3>Total: ₹<span id="total">0</span></h3>
    <button onclick="checkout()">Checkout</button>
</section>

<footer>
    <p>© 2026 StyleTech | Fashion & Electronics Store</p>
</footer>

<script src="script.js"></script>
</body>
</html>
